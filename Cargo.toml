[package]
name = "kindprobe"
version = "0.1.0"
edition = "2021"
description = "Fast, bounded, content-first file format identification tool and library"

[dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.36.2"
cfb = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "kindprobe"
path = "src/lib.rs"

[[bin]]
name = "kindprobe"
path = "src/main.rs"
