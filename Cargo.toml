[package]
name = "kindprobe"
version = "0.2.0"
edition = "2021"
description = "Fast, bounded, content-first file format identification tool and library"
license = "GPL-3.0-or-later"

[dependencies]
zip = { version = "9.8", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
cfb = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "kindprobe"
path = "src/lib.rs"

[[bin]]
name = "kindprobe"
path = "src/main.rs"
