[package]
name = "kindprobe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.kindprobe]
path = ".."

[[bin]]
name = "fuzz_detect_bytes"
path = "fuzz_targets/fuzz_detect_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_zip_cfb_containers"
path = "fuzz_targets/fuzz_zip_cfb_containers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
